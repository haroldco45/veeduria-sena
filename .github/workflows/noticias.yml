name: Robot de noticias
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar-noticias.mjs
      - name: Guardar cambios
        run: |
          git config user.name "robot-veeduria"
          git config user.email "actions@github.com"
          git add data/noticias.json
          git diff --staged --quiet || (git commit -m "Noticias actualizadas" && git push)
